# ============================================================================
# VeriDoc - local development stack
#
#   docker compose up -d postgres redis minio     # infrastructure only
#   docker compose up -d                          # full stack incl. api/worker/web
#
# Ports are deliberately non-default so the stack can run beside other services
# on a shared host.
# ============================================================================
name: veridoc

services:
  postgres:
    image: postgres:16-alpine
    container_name: veridoc-postgres
    environment:
      POSTGRES_USER: veridoc
      POSTGRES_PASSWORD: veridoc
      POSTGRES_DB: veridoc
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veridoc -d veridoc"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: veridoc-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "63799:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage. Originals and derived artifacts live in
  # separate buckets so retention can purge artifacts without touching evidence.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: veridoc-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: veridoc
      MINIO_ROOT_PASSWORD: veridoc-secret
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 8s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: veridoc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 veridoc veridoc-secret &&
      mc mb --ignore-existing local/veridoc-originals &&
      mc mb --ignore-existing local/veridoc-artifacts &&
      mc anonymous set none local/veridoc-originals &&
      mc anonymous set none local/veridoc-artifacts &&
      echo 'buckets ready (private)'
      "
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Override on a slow link, e.g.
        #   docker compose build --build-arg PIP_INDEX_URL=https://<mirror>/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    container_name: veridoc-api
    entrypoint: ["sh", "scripts/entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://veridoc:veridoc@postgres:5432/veridoc
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: s3
      S3_ENDPOINT_URL: http://minio:9000
      STORAGE_LOCAL_ROOT: /var/veridoc/storage
      ALLOWED_ORIGINS: http://localhost:3010,http://127.0.0.1:3010
    ports:
      - "8088:8000"
    volumes:
      - storage-data:/var/veridoc/storage
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
    command: ["python", "-m", "app.workers.worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://veridoc:veridoc@postgres:5432/veridoc
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: s3
      S3_ENDPOINT_URL: http://minio:9000
      STORAGE_LOCAL_ROOT: /var/veridoc/storage
    volumes:
      - storage-data:/var/veridoc/storage
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      replicas: 2

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: VeriDoc
        NEXT_PUBLIC_DEMO_MODE: "true"
    container_name: veridoc-web
    environment:
      BACKEND_API_URL: http://api:8000/api
      NODE_ENV: production
      SESSION_COOKIE_NAME: veridoc_session
    ports:
      - "3010:3000"
    depends_on:
      api: {condition: service_started}
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  storage-data:
